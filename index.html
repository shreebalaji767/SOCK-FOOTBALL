<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b10">
<title>3D Football</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="loading" id="loading"><div><div class="ball-loader">⚽</div><strong>3D FOOTBALL</strong><span>Loading match...</span></div></div>

<main id="game-shell">
<header class="topbar">
  <div class="brand"><div class="crest home-crest">H</div><div><strong>3D FOOTBALL</strong><small>PLAYER vs COMPUTER</small></div></div>
  <div class="scoreboard">
    <span class="team-name">HOME</span>
    <strong id="playerScore">0</strong><span class="dash">-</span><strong id="computerScore">0</strong>
    <span class="team-name">AWAY</span>
  </div>
  <div class="match-info"><span class="live"><i></i> LIVE</span><strong id="halfLabel">1ST HALF</strong><strong id="timer">00:00</strong><button id="pauseBtn">Ⅱ</button></div>
</header>

<section class="game-view">
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="status"><span class="dot"></span><strong id="statusText">MATCH LIVE</strong></div>
    <div class="commentary"><b>COMMENTARY</b><span id="commentaryText">Kick-off. Play the ball forward.</span></div>
    <div class="desktop-controls"><b>MOVE</b> WASD / ARROWS <b>PASS</b> E <b>SHOOT</b> SPACE <b>TACKLE</b> F <b>SWITCH</b> Q <b>SPRINT</b> SHIFT <b>PAUSE</b> P</div>
  </div>

  <div class="mobile-controls">
    <div class="pad">
      <button data-key="ArrowUp">▲</button>
      <div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
    </div>
    <div class="actions">
      <button id="passMobile" class="pass">↗<span>PASS</span></button>
      <button id="shootMobile" class="shoot">⚽<span>SHOOT</span></button>
      <button id="tackleMobile" class="tackle">TAC<span>TACKLE</span></button>
      <button id="sprintMobile" class="sprint">RUN<span>SPRINT</span></button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay hidden"><div class="panel"><h1>MATCH PAUSED</h1><p>Resume when you're ready.</p><button id="resumeBtn">RESUME</button></div></div>
  <div id="resultOverlay" class="overlay hidden"><div class="panel"><div class="final-score"><b id="finalHome">0</b><span>-</span><b id="finalAway">0</b></div><h1 id="resultTitle">FULL TIME</h1><p id="resultText"></p><button id="restartBtn">PLAY AGAIN</button></div></div>
</section>
</main>
<script type="module" src="./js/game.js"></script>
</body>
</html>
